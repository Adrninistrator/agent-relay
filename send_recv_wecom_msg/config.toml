# 企业微信机器人配置

# 企业微信后台获取的机器人 ID
bot_id = ""

# 长连接专用密钥
secret = ""

# 接收消息的会话 ID：单聊填用户 userid，群聊填群 chatid
chat_id = ""

# 会话类型：1 单聊，2 群聊
chat_type = 1

# 内存中消息数据的保存时长（秒），默认 300（5 分钟）
reply_ttl = 300

# 长连接地址，默认官方 wss://openws.work.weixin.qq.com
# 本地联调时可改为 mock 服务端，例如 ws://127.0.0.1:9000
# ws_url = "ws://127.0.0.1:9000"